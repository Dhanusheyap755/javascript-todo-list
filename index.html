<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Responsive JavaScript To-Do List with CRUD operations and localStorage persistence.">

    <title>TaskFlow - To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="todo-card" aria-labelledby="app-title">

            <!-- HEADER -->
            <header class="app-header">

                <div>
                    <p class="eyebrow">JavaScript Task Manager</p>

                    <h1 id="app-title">TaskFlow</h1>

                    <p class="subtitle">
                        Plan it. Do it. Keep moving.
                    </p>
                </div>

                <div class="stats">
                    <span id="taskCount">0 tasks</span>
                </div>

            </header>


            <!-- ADD TASK -->
            <form id="taskForm" class="task-form">

                <label class="sr-only" for="taskInput">
                    Enter a new task
                </label>

                <input
                    id="taskInput"
                    type="text"
                    placeholder="What needs to be done?"
                    maxlength="120"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Add Task
                </button>

            </form>


            <!-- FILTERS -->
            <div class="toolbar">

                <div
                    class="filters"
                    role="group"
                    aria-label="Task filters"
                >

                    <button
                        class="filter active"
                        data-filter="all"
                        type="button"
                    >
                        All
                    </button>

                    <button
                        class="filter"
                        data-filter="active"
                        type="button"
                    >
                        Active
                    </button>

                    <button
                        class="filter"
                        data-filter="completed"
                        type="button"
                    >
                        Completed
                    </button>

                </div>

                <button
                    id="clearCompleted"
                    class="text-button"
                    type="button"
                >
                    Clear completed
                </button>

            </div>


            <!-- EMPTY STATE -->
            <div id="emptyState" class="empty-state">

                <div class="empty-icon">✓</div>

                <h2>No tasks yet</h2>

                <p>
                    Add your first task above and start getting things done.
                </p>

            </div>


            <!-- TASK LIST -->
            <ul
                id="taskList"
                class="task-list"
                aria-live="polite"
            ></ul>


            <!-- FOOTER -->
            <footer class="app-footer">

                <span id="progressText">
                    0 completed
                </span>

                <span>
                    Saved automatically
                </span>

            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
